<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Pribadi - Bootstrap Darkly</title>
    <!-- Memuat file Bootstrap lokal -->
    <link href="bootstrap.min.css" rel="stylesheet">
    <!-- Memuat font Lato -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* VARIABEL TEMA ALA BOOTSTRAP DARKLY */
        :root {
            --bs-body-bg: #222;
            --bs-body-color: #dee2e6;
            --window-bg: #303030;
            --top-bar-bg: #2b2b2b;
            --top-bar-text: #fff;
            --main-bg: #222;
            --card-bg: #2b2b2b;
            --card-shadow: rgba(0, 0, 0, 0.5);
            --content-title: #fff;
            --text-color: #dee2e6;
            --link-color: #00bc8c;
            --input-bg: #fff;
            --input-border: #444;
            --input-text: #303030;
            --btn-bg: #00bc8c;
            --btn-hover-bg: #009670;
            --btn-border: #00bc8c;
            --btn-text: #fff;
        }

        /* LIGHT MODE */
        [data-bs-theme="light"] {
            --bs-body-bg: #f8f9fa;
            --bs-body-color: #212529;
            --window-bg: #ffffff;
            --top-bar-bg: #f1f3f5;
            --top-bar-text: #212529;
            --main-bg: #f8f9fa;
            --card-bg: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.15);
            --content-title: #212529;
            --text-color: #212529;
            --link-color: #00bc8c;
            --input-bg: #fff;
            --input-border: #ced4da;
            --input-text: #212529;
            --btn-bg: #00bc8c;
            --btn-hover-bg: #009670;
            --btn-border: #00bc8c;
            --btn-text: #fff;
        }

        * {
            font-family: Lato, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bs-body-bg);
            color: var(--bs-body-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .window {
            width: 100%;
            max-width: 900px;
            background: var(--window-bg);
            border-radius: 0.375rem;
            box-shadow: 0 1rem 3rem var(--card-shadow);
            border: 1px solid var(--input-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            width: 100%;
            height: 42px;
            background: var(--top-bar-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: var(--top-bar-text);
            font-size: 13px;
            font-weight: 700;
            border-bottom: 1px solid var(--input-border);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .java-icon {
            margin-right: 5px;
            font-size: 15px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 0.25rem;
            padding: 3px 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--top-bar-text);
            white-space: nowrap;
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            padding: 15px;
        }

        h1, h2 {
            font-weight: 700;
            color: var(--content-title);
            margin-bottom: 12px;
        }

        h1 { font-size: 1.4rem; }
        h2 { font-size: 1.1rem; margin-top: 20px; }

        /* UPLOAD SECTION */
        .upload-box {
            background: var(--card-bg);
            border: 2px dashed var(--input-border);
            padding: 15px;
            border-radius: 0.375rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-label {
            display: inline-block;
            background: #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 8px;
            border: 1px solid var(--input-border);
            font-size: 0.9rem;
        }

        .upload-label:hover {
            background: #555;
        }

        .file-name-display {
            font-size: 0.85rem;
            margin-bottom: 12px;
            color: var(--bs-body-color);
            opacity: 0.8;
            word-break: break-all;
        }

        /* TOMBOL SUBMIT */
        .btn-submit {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--btn-border);
            padding: 8px 20px;
            border-radius: 0.375rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }

        .btn-submit:hover {
            background: var(--btn-hover-bg);
        }

        /* GALLERY GRID */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 2px;
        }

        /* Responsive untuk Tablet / PC */
        @media (min-width: 576px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }
            .btn-submit {
                width: auto;
            }
            .main-content {
                padding: 25px;
            }
            body {
                padding: 20px;
            }
            h1 { font-size: 1.8rem; }
        }

        .gallery-item {
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: 0.375rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0.25rem 0.5rem var(--card-shadow);
        }

        .gallery-item img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            cursor: pointer; /* Indikasi bahwa gambar bisa diklik */
        }

        @media (min-width: 576px) {
            .gallery-item img {
                height: 140px;
            }
        }

        .gallery-info {
            padding: 8px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }

        .btn-delete {
            background: #e74c3c;
            border: none;
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }

        .btn-delete:hover {
            background: #c44133;
        }

        .empty-gallery {
            text-align: center;
            grid-column: 1 / -1;
            padding: 30px;
            opacity: 0.6;
            font-size: 0.9rem;
        }

        /* MODAL / LIGHTBOX FOTO BESAR */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
            border-radius: 0.375rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.5);
        }

        .image-modal-caption {
            color: #fff;
            margin-top: 15px;
            font-size: 0.95rem;
            text-align: center;
            word-break: break-all;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        .image-modal-close:hover {
            color: #00bc8c;
        }
    </style>
</head>
<body data-bs-theme="dark">

    <div class="window">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span class="java-icon">🖼️</span>
                <span>Galeri Foto Pribadi</span>
            </div>
            <button class="theme-toggle" id="themeToggle">☀️ Mode Terang</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <h1>Upload Foto Anda</h1>
            
            <!-- FORM UPLOAD DENGAN TOMBOL SUBMIT -->
            <div class="upload-box">
                <form id="uploadForm">
                    <input type="file" id="fotoInput" accept="image/*" multiple required>
                    <label for="fotoInput" class="upload-label">📂 Pilih Foto</label>
                    <div class="file-name-display" id="fileChosen">Belum ada file yang dipilih</div>
                    <button type="submit" class="btn-submit">Submit / Unggah</button>
                </form>
            </div>

            <!-- CONTAINER GALERI -->
            <h2>Daftar Foto Tersimpan</h2>
            <div class="gallery-grid" id="galleryGrid">
                <div class="empty-gallery" id="emptyMsg">Belum ada foto yang di-submit.</div>
            </div>
        </div>
    </div>

    <!-- MODAL POP-UP GAMBAR BESAR -->
    <div class="image-modal" id="imageModal">
        <button class="image-modal-close" id="modalClose">&times;</button>
        <img id="modalImg" src="" alt="Foto Diperbesar">
        <div class="image-modal-caption" id="modalCaption"></div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const fotoInput = document.getElementById("fotoInput");
        const fileChosen = document.getElementById("fileChosen");
        const uploadForm = document.getElementById("uploadForm");
        const galleryGrid = document.getElementById("galleryGrid");
        const emptyMsg = document.getElementById("emptyMsg");

        // Elemen Modal
        const imageModal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImg");
        const modalCaption = document.getElementById("modalCaption");
        const modalClose = document.getElementById("modalClose");

        // Muat foto dari localStorage saat halaman pertama kali dibuka/direload
        document.addEventListener("DOMContentLoaded", loadGallery);

        // Tutup modal ketika tombol 'X' diklik
        modalClose.addEventListener("click", function() {
            imageModal.style.display = "none";
        });

        // Tutup modal ketika area gelap di luar gambar diklik
        imageModal.addEventListener("click", function(e) {
            if (e.target === imageModal) {
                imageModal.style.display = "none";
            }
        });

        // Menampilkan nama file yang dipilih sebelum diklik tombol submit
        fotoInput.addEventListener("change", function() {
            if (this.files.length > 0) {
                let fileNames = Array.from(this.files).map(f => f.name).join(", ");
                fileChosen.textContent = `Terpilih: ${fileNames}`;
            } else {
                fileChosen.textContent = "Belum ada file yang dipilih";
            }
        });

        // Aksi ketika tombol Submit diklik
        uploadForm.addEventListener("submit", function(e) {
            e.preventDefault();
            const files = fotoInput.files;

            if (files.length > 0) {
                Array.from(files).forEach(file => {
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        const base64Image = e.target.result;
                        const photoData = { name: file.name, src: base64Image };

                        // Simpan ke localStorage
                        saveToLocalStorage(photoData);

                        // Tampilkan ke layar
                        renderPhoto(photoData);
                    }

                    reader.readAsDataURL(file);
                });

                uploadForm.reset();
                fileChosen.textContent = "Belum ada file yang dipilih";
            }
        });

        function saveToLocalStorage(photo) {
            let photos = JSON.parse(localStorage.getItem("galleryPhotos")) || [];
            photos.push(photo);
            localStorage.setItem("galleryPhotos", JSON.stringify(photos));
        }

        function loadGallery() {
            let photos = JSON.parse(localStorage.getItem("galleryPhotos")) || [];
            if (photos.length > 0) {
                emptyMsg.style.display = "none";
                photos.forEach((photo, index) => {
                    renderPhoto(photo, index);
                });
            }
        }

        function renderPhoto(photo) {
            emptyMsg.style.display = "none";
            const item = document.createElement("div");
            item.classList.add("gallery-item");

            item.innerHTML = `
                <img src="${photo.src}" alt="Foto Pribadi" class="clickable-img" title="Klik untuk memperbesar">
                <div class="gallery-info">
                    <span style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 90px;" title="${photo.name}">${photo.name}</span>
                    <button class="btn-delete" type="button">Hapus</button>
                </div>
            `;

            // Fitur klik untuk memperbesar foto
            item.querySelector(".clickable-img").addEventListener("click", function() {
                modalImg.src = photo.src;
                modalCaption.textContent = photo.name;
                imageModal.style.display = "flex";
            });

            // Tombol hapus dengan update localStorage
            item.querySelector(".btn-delete").addEventListener("click", function() {
                item.remove();
                removeFromLocalStorage(photo.name, photo.src);
                checkEmpty();
            });

            galleryGrid.appendChild(item);
        }

        function removeFromLocalStorage(name, src) {
            let photos = JSON.parse(localStorage.getItem("galleryPhotos")) || [];
            photos = photos.filter(p => !(p.name === name && p.src === src));
            localStorage.setItem("galleryPhotos", JSON.stringify(photos));
        }

        function checkEmpty() {
            if (galleryGrid.querySelectorAll('.gallery-item').length === 0) {
                emptyMsg.style.display = "block";
            }
        }

        // Toggle Dark Mode & Light Mode
        const themeToggle = document.getElementById("themeToggle");
        const bodyElement = document.body;

        const savedTheme = localStorage.getItem("bs-theme") || "dark";
        bodyElement.setAttribute("data-bs-theme", savedTheme);
        themeToggle.textContent = savedTheme === "dark" ? "☀️ Mode Terang" : "🌙 Mode Gelap";

        themeToggle.addEventListener("click", function () {
            let currentTheme = bodyElement.getAttribute("data-bs-theme");
            
            if (currentTheme === "dark") {
                bodyElement.setAttribute("data-bs-theme", "light");
                localStorage.setItem("bs-theme", "light");
                themeToggle.textContent = "🌙 Mode Gelap";
            } else {
                bodyElement.setAttribute("data-bs-theme", "dark");
                localStorage.setItem("bs-theme", "dark");
                themeToggle.textContent = "☀️ Mode Terang";
            }
        });
    </script>

</body>
</html>
